<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CSS3 &amp; HTML5 高级特性实战手册">
  <!-- 与站点品牌色一致：brand #06b6d4 → accent #7c3aed 渐变 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)" />
  <!-- 代码尖括号：16px 下仍可辨识的最简符号 -->
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12.4 10.4 6.9 16l5.5 5.6" />
    <path d="M19.6 10.4 25.1 16l-5.5 5.6" />
  </g>
</svg>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tailwind v4 设计系统 Playground</title>
</head>
<body>
  <div id="root">
    <main style="max-width:680px;margin:48px auto;padding:0 24px;font-family:ui-sans-serif,system-ui,-apple-system,'PingFang SC',sans-serif;line-height:1.7;color:#0f172a">
      <h1 style="margin:0 0 12px;font-size:24px">Tailwind v4 设计系统 Playground</h1>
      <p style="margin:0 0 12px"><strong>这是一个 Vite mini-project，不是单文件示例。</strong>直接双击以 file:// 打开时，浏览器会拦截 <code>/src/main.tsx</code> 模块，所以只显示本提示。</p>
      <p style="margin:0 0 6px">启动方式：</p>
      <pre style="margin:0 0 12px;padding:12px 16px;border-radius:8px;background:#0f172a;color:#e2e8f0;overflow:auto">npm install
npm run dev</pre>
      <p style="margin:0;color:#64748b">更多说明见同目录 README.md。</p>
    </main>
  </div>
  <!-- 上面的提示会在 Vite dev server 下被 React 根节点替换；file:// 直开时作为兜底避免白屏 -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
